<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokédex Master Set | TirayTCG</title>
<meta name="description" content="Marque os Pokémon que você já tem e envie pelo WhatsApp os que ainda faltam.">
<meta name="theme-color" content="#0a1740">
<link rel="icon" href="assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="catalogo.css?v=5">
<link rel="stylesheet" href="pokedex.css?v=1">
</head>
<body class="ms">
<main class="ms-page">
  <header class="ms-head">
    <a class="ms-back" href="./">← Voltar</a>
    <h1>Pokédex dos 250</h1>
    <p>Toque nos Pokémon que você <b>já tem</b>. No final, envie pelo WhatsApp a lista do que ainda falta.</p>
  </header>

  <section class="pk-progress" aria-live="polite">
    <div class="pk-bar"><i id="fill"></i></div>
    <p id="progress"></p>
  </section>

  <section class="ms-filters" aria-label="Filtros">
    <input id="q" type="search" placeholder="Buscar por nome ou número…" autocomplete="off">
    <select id="view" aria-label="Mostrar">
      <option value="all">Mostrar: todos</option>
      <option value="missing">Só os que faltam</option>
      <option value="have">Só os que tenho</option>
    </select>
    <button id="clear-all" type="button" class="ms-reset">Desmarcar todos</button>
  </section>

  <section id="grid" class="pk-grid" aria-label="Pokédex"></section>
</main>

<div class="ms-bar">
  <button id="open" class="ms-bar-btn"><span id="bar-text"></span><b>Enviar o que falta</b></button>
</div>

<div id="sheet" class="ms-sheet" hidden>
  <div class="ms-sheet-back" data-close></div>
  <div class="ms-sheet-box" role="dialog" aria-label="Pokémon que faltam">
    <div class="ms-sheet-top"><h2>Me faltam…</h2><button class="ms-x" data-close aria-label="Fechar">✕</button></div>
    <textarea id="msg" class="pk-msg" readonly></textarea>
    <a id="send" class="card whats ms-send" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm5.3 14.2c-.2.6-1.300 1.200-1.800 1.200-.5.100-1 .200-3.300-.7-2.800-1.100-4.600-3.900-4.700-4.100-.1-.2-1.100-1.500-1.100-2.800s.7-2 1-2.300c.2-.3.500-.3.700-.3h.5c.2 0 .4 0 .6.500l.8 2c.1.200.1.300 0 .5l-.3.500-.4.400c-.1.200-.3.300-.1.600.2.300.8 1.300 1.700 2.100 1.200 1 2.100 1.300 2.400 1.500.3.100.5.100.6-.1l.9-1.100c.2-.3.400-.2.600-.1l1.900.9c.3.100.5.200.5.300.1.200.1.800-.1 1.400z"/></svg>
      <span class="txt"><b>Enviar no WhatsApp</b><small>Lista dos Pokémon que faltam</small></span>
    </a>
    <button id="copy" type="button" class="pk-copy">Copiar lista (se o WhatsApp não abrir)</button>
  </div>
</div>

<script src="pokedex.js?v=1"></script>
</body>
</html>
